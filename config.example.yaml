# larkim configuration. Copy to ~/.larkim/config.yaml and edit; every key is
# optional and falls back to the value shown here.

# Database, attachments and the daemon lock live here.
data_dir: ~/.larkim

# Empty tries /opt/homebrew/bin/lark-cli, then $PATH.
lark_cli_path: ""

# Pause between sweep ticks, in milliseconds, and between discovery cycles;
# a TUI syncing in-process runs discovery back to back while its window has
# focus. Values below 100 are raised to 100.
poll_interval_ms: 3000

# How far each search window reaches behind the watermark, to absorb the
# search index's own latency (measured around 10s).
overlap: 2m

# Bound on the initial history pull per chat.
backfill_days: 30

# How many of the most active chats the slow path reconciles.
active_top_k: 30

# Full chat listing, including per-chat mute settings.
chats_refresh_every: 10m

# Reconciliation of the active chats from their cursors; catches what the
# search index misses.
slow_path_every: 10m

# Re-list the chats active in the last week so edits and recalls land.
repair_every: 6h

# Gap in milliseconds between two lark:// navigations of the Feishu desktop
# client. The client sends its read receipt once it has drawn the chat it was
# walked onto, so too small a gap loses the chats a sweep hurried it through —
# a client sitting in the background draws slower than the active app.
# `:set applink_pace_ms=<n>` retunes it for one TUI session; `:config` writes
# the value that stays.
applink_pace_ms: 1000

# How the Feishu client's own red dot comes down once larkim has read a chat.
# applink walks the desktop client onto the chat and it sends the receipt; it
# needs the client running and reports nothing back. web posts the chat's read
# watermark to the web client with the Feishu login of `browser`, and each chat
# answers for itself. A chat is matched to the web client once, through its
# newest message, and stays clearable after that, Done included; one never
# matched is reported and left lit. The first read of a process asks for
# Keychain access to that browser's cookies. browser is one of brave, chrome,
# chromium, edge.
mark_read:
  mode: applink
  browser: chrome

# Messages matching any rule keep their place in the chat but carry no unread
# badge and never move their chat up the list. A rule's fields are an AND, an
# omitted field matches anything, and a rule with no field set is refused.
# `larkim silence` says how many messages each rule currently matches.
silence: []
#  - chat: oc_quiet       # chat_id, from `larkim chats list`
#    sender: cli_c        # sender_id, from `larkim contacts list --search`
#  - contains: nightly build   # case-insensitive substring of the message text
# Settle the server-side read watermark past silenced messages too, so the
# Feishu clients' own dots follow the same rules (needs mark_read.mode: web).
# One-way: dropping a rule never re-lights a dot anywhere.
silence_sync: false

resources:
  # Skip attachments larger than this; 0 means unlimited.
  max_bytes: 52428800 # 50 MiB

ai:
  # Command that starts an ACP agent on stdio; the agent holds its own login.
  agent: omp --mode acp
  # A value of the agent's model option: an exact id, or a part of one that
  # names a single model. Empty keeps the agent's default.
  model: cursor/composer-2.5-fast
  # Recent messages handed to the assistant.
  context: 80
  # Environment variable holding the TypeSafe API key. The reaction picker
  # asks Jev which emoji fits the message under the cursor and lays what it
  # chose over the grid's first three rows; with no key there the picker
  # opens on the grid alone.
  jev_key_env: TYPESAFE_API_KEY
  # The evaluation endpoint that answers it.
  jev_endpoint: https://api.typesafe.ai/v1/systemone
